[project]
name = "mtpserve"
version = "0.1.0"
description = "OpenAI-compatible server for MLX models with MTP speculative decoding and pinned prefix caching"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mlx>=0.30",
    "mlx-lm>=0.31",
]

[project.scripts]
mtpserve = "mtpserve.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtpserve"]
